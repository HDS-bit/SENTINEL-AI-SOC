version: '3.8'

services:
  # 1. Unified Full-Stack SENTINEL Container (API + WebSockets + Static React SPA)
  sentinel-fullstack:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel_enterprise_soc
    restart: always
    ports:
      - "5000:5000"
      - "80:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - JWT_SECRET=sentinel-super-secret-cyber-soc-jwt-key-2025-defense-token
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - sentinel-data:/app/server/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sentinel-data:
    driver: local
